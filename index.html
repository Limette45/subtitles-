<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TXT to PDF</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


</head>
<body>

<h2>TXT → PDF</h2>

<input type="file" id="fileInput" accept=".txt">

<button id="convert" disabled>
    Convert to PDF
</button>

<script>
const fileInput = document.getElementById("fileInput");
const convertButton = document.getElementById("convert");

let selectedFile = null;

fileInput.addEventListener("change", () => {
    selectedFile = fileInput.files[0];

    if (selectedFile) {
        convertButton.disabled = false;
    }
});

convertButton.addEventListener("click", async () => {
    if (!selectedFile) return;

    const text = await selectedFile.text();

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({
        orientation: 'p',
        unit: 'mm',
        format: 'a4'
    });

    // フォントサイズを12ptに設定
    pdf.setFontSize(12);

    // 余白を考慮した印刷可能幅（A4幅210mm - 左右余白30mm = 180mm）
    const pageWidth = 180;
    const marginLeft = 15;
    const marginTop = 20;
    const marginBottom = 20;
    
    // A4の高さ（297mm）から上下の余白を引いた有効な高さ
    const pageHeight = 297 - marginTop - marginBottom;
    
    // 1行あたりの高さ（フォントサイズ12ptの場合の目安）
    const lineHeight = 7;
    const maxLinesPerPage = Math.floor(pageHeight / lineHeight);

    // 段落（空行）ごとに分割して、文章中の改行はスペースに置換する処理
    // （連続する空行を区切りとして段落を保持し、段落内の改行は半角スペースに直す）
    const paragraphs = text.split(/\r?\n\s*\r?\n/);
    let allLines = [];

    paragraphs.forEach((para, index) => {
        // 段落内の改行を半角スペースに変換し、連続するスペースを整える
        const cleanedPara = para.replace(/\r?\n/g, " ").replace(/\s+/g, " ").trim();
        
        if (cleanedPara !== "") {
            // 指定した幅に収まるようにテキストを折り返す
            const wrapped = pdf.splitTextToSize(cleanedPara, pageWidth);
            allLines.push(...wrapped);
        }

        // 段落の間に空行を挿入（最後の段落以外）
        if (index < paragraphs.length - 1) {
            allLines.push("");
        }
    });

    let currentLineIndex = 0;
    let isFirstPage = true;

    while (currentLineIndex < allLines.length) {
        if (!isFirstPage) {
            pdf.addPage();
        }

        // 現在のページに描画する行を取得
        const linesToPrint = allLines.slice(currentLineIndex, currentLineIndex + maxLinesPerPage);
        
        pdf.text(linesToPrint, marginLeft, marginTop);

        currentLineIndex += maxLinesPerPage;
        isFirstPage = false;
    }

    pdf.save(
        selectedFile.name.replace(/\.txt$/i, "") + ".pdf"
    );
});
</script>

</body>
</html>
